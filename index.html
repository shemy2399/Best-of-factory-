
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- إعدادات التطبيق للموبايل -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="خياله">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2809/2809794.png">
    <link rel="manifest" href="/manifest.json">

    <title>خياله</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
      body {
        font-family: 'Tajawal', sans-serif;
        background-color: #1f2937; /* bg-gray-800 */
        color: #d1d5db; /* text-gray-300 */
        overscroll-behavior-y: none; /* منع السحب للتحديث في الموبايل */
      }
      input, select, textarea, button {
        font-family: inherit;
      }
      /* تخصيص شريط التمرير */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #111827;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #f59e0b;
      }

      @media print {
        .no-print, #sidebar, header, .sidebar-backdrop { display: none !important; }
        html, body, #root, .flex, main {
          height: auto !important;
          overflow: visible !important;
          background-color: white !important;
          color: black !important;
          margin: 0 !important; padding: 0 !important; display: block !important; width: 100% !important;
        }
        main { padding: 0 !important; }
        .bg-gray-700, .bg-gray-800, .bg-gray-900 {
          background-color: transparent !important;
          border-color: #eee !important;
          box-shadow: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('Service Worker registered', reg))
            .catch(err => console.log('Service Worker registration failed', err));
        });
      }
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
